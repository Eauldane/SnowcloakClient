name: .NET Build

on:
  push:
    branches: '*'
  pull_request:

jobs:
  build:
    runs-on: dalamud
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Dotnet Restore
        run: dotnet restore
      - name: Build
        run: |
          dotnet build --no-restore --configuration Release --nologo
      - name: Archive
        run: |
          OUTPUT="$PWD/SnowcloakClient.zip"
          cd /workspace/Eauldane/SnowcloakClient/Snowcloak/bin/x64/Release/win-x64
          zip -rq "$OUTPUT" .
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnowcloakClient
          path: SnowcloakClient.zip
          if-no-files-found: error