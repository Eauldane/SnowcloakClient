name: Create Release

on:
  push:
    tags: '*'

jobs:
  build:
    runs-on: dalamud
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Dotnet Restore
        run: dotnet restore
      - name: Build
        run: |
          TAG="${FORGEJO_REF#refs/tags/}"     
          VERSION="${TAG#v}"
          # Remove prerelease metadata for numeric assembly versions
          ASSEMBLY_VERSION="${VERSION%%[-+]*}"
          
          echo "Building Snowcloak version $VERSION"
          
          dotnet build \
          --no-restore \
          --configuration Release \
          --nologo \
          "-p:Version=$VERSION" \
          "-p:FileVersion=$ASSEMBLY_VERSION" \
          "-p:AssemblyVersion=$ASSEMBLY_VERSION"
        
      - name: Prepare release files
        shell: bash
        run: |
          SOURCE="Snowcloak/bin/x64/Release/win-x64/Snowcloak/latest.zip"
          mkdir -p dist/release
          cp "$SOURCE" dist/release/latest.zip
      - name: Upload a Build Artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: Snowcloak-${{ forgejo.ref_name }}
          path: dist/release/latest.zip
          if-no-files-found: error
      - name: Test Forgejo connection
        shell: bash
        env:
          INSTANCE: ${{ forgejo.server_url }}
          REPOSITORY: ${{ forgejo.repository }}
        run: |
          echo "Forgejo URL: $INSTANCE"
          echo "Repository: $REPOSITORY"

          curl -v \
            --connect-timeout 5 \
            --max-time 20 \
            "$INSTANCE/api/v1/version"
      - name: Publish Forgejo Release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: ${{ forgejo.server_url }}
          repo: ${{ forgejo.repository }}
          tag: ${{ forgejo.ref_name }}
          token: ${{ forgejo.token }}
          release-dir: dist/release
          override: false